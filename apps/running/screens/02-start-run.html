<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start run · Stride</title>
  <!-- Stride design system: colours, fonts and radius. Remove class="dark" above for the light theme. -->
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover);
      --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary);
      --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-border: var(--border);
      --color-input: var(--input);
      --color-ring: var(--ring);
      --color-chart-1: var(--chart-1);
      --color-chart-2: var(--chart-2);
      --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4);
      --color-chart-5: var(--chart-5);
      --font-sans: var(--font-sans);
      --font-heading: var(--font-heading);
      --radius-sm: calc(var(--radius) - 4px);
      --radius-md: calc(var(--radius) - 2px);
      --radius-lg: var(--radius);
      --radius-xl: calc(var(--radius) + 4px);
      --spacing-touch: var(--touch);
      --spacing-screen: var(--screen-padding);
      --spacing-tab-bar: var(--tab-bar);
    }
    @layer base {
      body { @apply bg-background font-sans font-medium text-foreground antialiased; }
    }
  </style>
</head>
<body>
  <main class="mx-auto flex h-[844px] w-[390px] flex-col overflow-hidden bg-background">
    <div class="flex h-12 shrink-0 items-center justify-between px-8 pt-2 text-[15px] font-semibold">
      <span class="tabular-nums">9:41</span>
      <span class="flex items-center gap-1.5" aria-hidden="true">
        <svg class="h-3 w-[18px]" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg class="h-3 w-4" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 .9.2 1.2.5L8 11.2 6.8 9.8c.3-.3.7-.5 1.2-.5Z"/></svg>
        <svg class="h-3 w-[26px]" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><path d="M24 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <header class="flex h-touch shrink-0 items-center justify-between px-3">
      <a href="01-today.html" class="flex size-touch items-center justify-center rounded-full" aria-label="Close"><svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
      <h1 class="font-heading text-[19px] font-bold uppercase">Outdoor run</h1>
      <button class="flex size-touch items-center justify-center rounded-full" aria-label="Run settings"><svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
    </header>
    <div class="flex flex-1 flex-col gap-5 overflow-hidden px-screen pt-2">
      <p class="flex items-center gap-2 self-center rounded-full bg-secondary px-4 py-2 text-[13px] font-semibold"><span class="size-2 rounded-full bg-chart-2"></span>GPS ready · accurate to 4 m</p>
      <section class="flex flex-col gap-3" aria-labelledby="goal">
        <h2 id="goal" class="font-heading text-[19px] font-bold uppercase">Goal</h2>
        <div class="grid grid-cols-2 gap-3" role="radiogroup" aria-labelledby="goal">
          <button role="radio" aria-checked="false" class="flex min-h-[84px] flex-col justify-between rounded-lg border-2 p-3.5 text-left border-transparent bg-card">
            <span class="text-muted-foreground"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></span>
            <span><span class="block text-[15px] font-semibold">Free run</span><span class="block text-[13px] text-muted-foreground">No target</span></span>
          </button>
          <button role="radio" aria-checked="true" class="flex min-h-[84px] flex-col justify-between rounded-lg border-2 p-3.5 text-left border-primary bg-card">
            <span class="text-primary"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg></span>
            <span><span class="block text-[15px] font-semibold">Distance</span><span class="block text-[13px] text-muted-foreground">10 km</span></span>
          </button>
          <button role="radio" aria-checked="false" class="flex min-h-[84px] flex-col justify-between rounded-lg border-2 p-3.5 text-left border-transparent bg-card">
            <span class="text-muted-foreground"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg></span>
            <span><span class="block text-[15px] font-semibold">Time</span><span class="block text-[13px] text-muted-foreground">45 min</span></span>
          </button>
          <button role="radio" aria-checked="false" class="flex min-h-[84px] flex-col justify-between rounded-lg border-2 p-3.5 text-left border-transparent bg-card">
            <span class="text-muted-foreground"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg></span>
            <span><span class="block text-[15px] font-semibold">Pace</span><span class="block text-[13px] text-muted-foreground">5:00 /km</span></span>
          </button>
        </div>
      </section>
      <section class="flex items-center justify-between rounded-lg bg-card p-3" aria-label="Distance goal">
        <button class="flex size-touch items-center justify-center rounded-md bg-secondary font-heading text-[28px] font-bold" aria-label="Shorter">−</button>
        <p class="text-center"><span class="font-heading text-[56px] leading-none font-bold tabular-nums">10.0</span><span class="ml-1 font-heading text-[19px] font-bold text-muted-foreground uppercase">km</span></p>
        <button class="flex size-touch items-center justify-center rounded-md bg-secondary font-heading text-[28px] font-bold" aria-label="Longer">+</button>
      </section>
      <div class="flex items-center gap-3 rounded-lg bg-card px-4 py-3">
        <span class="text-muted-foreground"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg></span>
        <p class="flex-1 text-[15px]">Audio cue every 1 km</p>
        <span class="flex h-7 w-12 items-center justify-end rounded-full bg-primary p-0.5"><span class="size-6 rounded-full bg-primary-foreground"></span></span>
      </div>
      <div class="mt-auto flex flex-col items-center gap-3 pb-4">
        <a href="03-running.html" class="flex size-[132px] items-center justify-center rounded-full bg-primary font-heading text-[34px] font-bold text-primary-foreground uppercase shadow-[0_0_0_10px_color-mix(in_oklab,var(--primary)_18%,transparent)]">Start</a>
        <p class="text-[13px] text-muted-foreground">Last run here: 3 days ago</p>
      </div>
    </div>
    <div class="flex h-[34px] shrink-0 items-end justify-center pb-2" aria-hidden="true"><span class="h-[5px] w-[134px] rounded-full bg-foreground/80"></span></div>
  </main>
</body>
</html>
