<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress · Stillpoint</title>
  <!-- Calm design system: colours, fonts and radius. Add class="dark" to <html> for the dark theme. -->
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover);
      --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary);
      --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-border: var(--border);
      --color-input: var(--input);
      --color-ring: var(--ring);
      --color-chart-1: var(--chart-1);
      --color-chart-2: var(--chart-2);
      --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4);
      --color-chart-5: var(--chart-5);
      --font-sans: var(--font-sans);
      --font-heading: var(--font-heading);
      --radius-sm: calc(var(--radius) - 12px);
      --radius-md: calc(var(--radius) - 8px);
      --radius-lg: var(--radius);
      --spacing-touch: var(--touch);
      --spacing-screen: var(--screen-padding);
      --spacing-tab-bar: var(--tab-bar);
      /* Very soft, and only on sheets. */
      --shadow-sheet: 0 -8px 32px -16px oklch(0.25 0.02 155 / 0.3);
    }
    @layer base {
      body { @apply bg-background font-sans text-foreground antialiased; }
    }
  </style>
</head>
<body>
  <main class="relative mx-auto flex h-[844px] w-[390px] flex-col overflow-hidden bg-background">
    <div class="flex h-12 shrink-0 items-center justify-between px-8 pt-2 text-[15px] font-semibold">
      <span class="tabular-nums">9:41</span>
      <span class="flex items-center gap-1.5" aria-hidden="true">
        <svg class="h-3 w-[18px]" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg class="h-3 w-4" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 .9.2 1.2.5L8 11.2 6.8 9.8c.3-.3.7-.5 1.2-.5Z"/></svg>
        <svg class="h-3 w-[26px]" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><path d="M24 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <header class="flex shrink-0 items-center px-2"><a href="01-today.html" class="flex size-touch items-center justify-center rounded-full" aria-label="Back"><svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a></header>
    <div class="flex flex-1 flex-col gap-5 overflow-hidden px-screen">
      <h1 class="font-heading text-[32px] leading-[1.15] font-medium tracking-[-0.01em]">Your practice</h1>
      <section class="grid grid-cols-3 gap-3" aria-label="All time">
        <div class="rounded-lg bg-card px-4 py-4"><p class="font-heading text-[28px] leading-none font-medium tabular-nums">12</p><p class="mt-1 text-[13px] text-muted-foreground">day streak</p></div>
        <div class="rounded-lg bg-card px-4 py-4"><p class="font-heading text-[28px] leading-none font-medium tabular-nums">1,286</p><p class="mt-1 text-[13px] text-muted-foreground">minutes</p></div>
        <div class="rounded-lg bg-card px-4 py-4"><p class="font-heading text-[28px] leading-none font-medium tabular-nums">142</p><p class="mt-1 text-[13px] text-muted-foreground">sessions</p></div>
      </section>
      <section class="rounded-lg bg-card p-5" aria-labelledby="week">
        <div class="flex items-baseline justify-between">
          <h2 id="week" class="text-[17px] font-semibold">This week</h2>
          <p class="text-[14px] text-muted-foreground tabular-nums">75 min · 12.5 a day</p>
        </div>
        <svg class="mt-4 h-[128px] w-full" viewBox="0 0 294 128" aria-hidden="true">
          <rect x="6" y="52" width="30" height="48" rx="8" fill="var(--chart-5)"/><text x="21" y="44" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">12</text><text x="21" y="122" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted-foreground)">M</text>
          <rect x="48" y="60" width="30" height="40" rx="8" fill="var(--chart-5)"/><text x="63" y="52" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">10</text><text x="63" y="122" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted-foreground)">T</text>
          <rect x="90" y="20" width="30" height="80" rx="8" fill="var(--chart-5)"/><text x="105" y="12" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">20</text><text x="105" y="122" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted-foreground)">W</text>
          <rect x="132" y="68" width="30" height="32" rx="8" fill="var(--chart-5)"/><text x="147" y="60" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">8</text><text x="147" y="122" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted-foreground)">T</text>
          <rect x="174" y="40" width="30" height="60" rx="8" fill="var(--chart-5)"/><text x="189" y="32" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">15</text><text x="189" y="122" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted-foreground)">F</text>
          <rect x="216" y="60" width="30" height="40" rx="8" fill="var(--primary)"/><text x="231" y="52" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">10</text><text x="231" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--foreground)">S</text>
          <rect x="258" y="96" width="30" height="4" rx="2" fill="var(--muted)"/><text x="273" y="122" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted-foreground)">S</text>
        </svg>
      </section>
      <section aria-labelledby="mood">
        <div class="mb-3 flex items-baseline justify-between">
          <h2 id="mood" class="font-heading text-[19px] font-medium">How you felt after</h2>
          <a href="#" class="text-[15px] font-semibold text-primary">Log today</a>
        </div>
        <ul class="flex flex-col divide-y divide-border rounded-lg bg-card">
          <li class="flex min-h-[52px] items-center gap-4 px-5"><span class="w-10 text-[14px] text-muted-foreground">Sat</span><span class="text-primary"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg></span><span class="flex-1 text-[16px]">Calm</span></li>
          <li class="flex min-h-[52px] items-center gap-4 px-5"><span class="w-10 text-[14px] text-muted-foreground">Fri</span><span class="text-chart-2"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10V9"/><path d="M8 16h8"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg></span><span class="flex-1 text-[16px]">Tired</span></li>
          <li class="flex min-h-[52px] items-center gap-4 px-5"><span class="w-10 text-[14px] text-muted-foreground">Thu</span><span class="text-primary"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg></span><span class="flex-1 text-[16px]">Calm</span></li>
          <li class="flex min-h-[52px] items-center gap-4 px-5"><span class="w-10 text-[14px] text-muted-foreground">Wed</span><span class="text-chart-4"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10V9"/><path d="M9 10V9"/><path d="M9 16a5 5 0 016 0"/><circle cx="12" cy="12" r="10"/></svg></span><span class="flex-1 text-[16px]">Anxious</span></li>
        </ul>
      </section>
    </div>
    <div class="flex h-[34px] shrink-0 items-end justify-center pb-2" aria-hidden="true"><span class="h-[5px] w-[134px] rounded-full bg-foreground/70"></span></div>
  </main>
</body>
</html>
