<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleep · Stillpoint</title>
  <!-- Calm design system: colours, fonts and radius. This screen is always dark; it is used at bedtime. -->
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover);
      --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary);
      --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-border: var(--border);
      --color-input: var(--input);
      --color-ring: var(--ring);
      --color-chart-1: var(--chart-1);
      --color-chart-2: var(--chart-2);
      --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4);
      --color-chart-5: var(--chart-5);
      --font-sans: var(--font-sans);
      --font-heading: var(--font-heading);
      --radius-sm: calc(var(--radius) - 12px);
      --radius-md: calc(var(--radius) - 8px);
      --radius-lg: var(--radius);
      --spacing-touch: var(--touch);
      --spacing-screen: var(--screen-padding);
      --spacing-tab-bar: var(--tab-bar);
      /* Very soft, and only on sheets. */
      --shadow-sheet: 0 -8px 32px -16px oklch(0.25 0.02 155 / 0.3);
    }
    @layer base {
      body { @apply bg-background font-sans text-foreground antialiased; }
    }
  </style>
</head>
<body>
  <main class="relative mx-auto flex h-[844px] w-[390px] flex-col overflow-hidden bg-background">
    <div class="flex h-12 shrink-0 items-center justify-between px-8 pt-2 text-[15px] font-semibold">
      <span class="tabular-nums">9:41</span>
      <span class="flex items-center gap-1.5" aria-hidden="true">
        <svg class="h-3 w-[18px]" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg class="h-3 w-4" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 .9.2 1.2.5L8 11.2 6.8 9.8c.3-.3.7-.5 1.2-.5Z"/></svg>
        <svg class="h-3 w-[26px]" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><path d="M24 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <header class="flex shrink-0 items-center justify-between px-2">
      <a href="02-explore.html" class="flex size-touch items-center justify-center rounded-full" aria-label="Back"><svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <button class="flex h-touch items-center gap-2 rounded-full bg-card px-4 text-[14px] font-semibold" aria-label="Sleep timer: 30 minutes"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>30 min</button>
    </header>
    <div class="flex flex-1 flex-col gap-6 overflow-hidden px-screen pt-2">
      <header>
        <h1 class="font-heading text-[32px] leading-[1.15] font-medium tracking-[-0.01em]">Sleep</h1>
        <p class="mt-1 text-[15px] text-muted-foreground">Lights low. Everything here fades out on its own.</p>
      </header>
      <section aria-labelledby="stories">
        <h2 id="stories" class="mb-3 font-heading text-[19px] font-medium">Sleep stories</h2>
        <ul class="flex flex-col gap-3">
          <li><a href="#" class="flex items-center gap-4 rounded-lg bg-card p-3"><svg class="size-20 shrink-0 rounded-md" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="120" fill="var(--chart-3)"/><circle cx="36" cy="28" r="1.5" fill="var(--card)"/><circle cx="128" cy="20" r="1.5" fill="var(--card)"/><circle cx="140" cy="48" r="1.5" fill="var(--card)"/><path d="M72 40h16l6 56H66Z" fill="var(--card)"/><path d="M69 62h22l1.5 10h-25Z" fill="var(--chart-2)"/><rect x="70" y="28" width="20" height="12" rx="2" fill="var(--chart-2)"/><path d="M76 20h8l6 8H70Z" fill="var(--chart-1)"/><path d="M0 96c26-8 54-8 80 0s54 8 80 0v24H0Z" fill="var(--chart-1)"/></svg><span class="flex-1"><span class="block text-[17px] font-semibold">The lighthouse keeper</span><span class="block text-[14px] text-muted-foreground">Read by Tom Okafor</span><span class="block text-[14px] text-muted-foreground">32 min</span></span><span class="flex size-touch items-center justify-center rounded-full bg-primary text-primary-foreground" aria-label="Play The lighthouse keeper"><svg class="size-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></span></a></li>
          <li><a href="#" class="flex items-center gap-4 rounded-lg bg-card p-3"><svg class="size-20 shrink-0 rounded-md" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="120" fill="var(--chart-3)"/><circle cx="108" cy="38" r="18" fill="var(--card)"/><circle cx="116" cy="32" r="16" fill="var(--chart-3)"/><circle cx="40" cy="26" r="2" fill="var(--card)"/><circle cx="62" cy="44" r="1.5" fill="var(--card)"/><circle cx="28" cy="58" r="1.5" fill="var(--card)"/><path d="M0 92c40-20 80-20 160 0v28H0Z" fill="var(--chart-1)"/></svg><span class="flex-1"><span class="block text-[17px] font-semibold">Slow train north</span><span class="block text-[14px] text-muted-foreground">Read by Ana Lindqvist</span><span class="block text-[14px] text-muted-foreground">28 min</span></span><span class="flex size-touch items-center justify-center rounded-full bg-primary text-primary-foreground" aria-label="Play Slow train north"><svg class="size-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></span></a></li>
        </ul>
      </section>
      <section aria-labelledby="sounds">
        <h2 id="sounds" class="mb-3 font-heading text-[19px] font-medium">Soundscapes</h2>
        <ul class="grid grid-cols-2 gap-3">
          <li><button aria-pressed="true" class="flex h-20 w-full flex-col justify-between rounded-lg p-4 text-left bg-secondary ring-1 ring-primary"><span class="text-primary"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg></span><span class="text-[15px] font-semibold">Rain on a tin roof</span></button></li>
          <li><button aria-pressed="false" class="flex h-20 w-full flex-col justify-between rounded-lg p-4 text-left bg-card"><span class="text-chart-3"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 19q2.5 2 5 0t5 0 5 0 5 0"/><path d="M2 5q2.5 2 5 0t5 0 5 0 5 0"/></svg></span><span class="text-[15px] font-semibold">Low tide</span></button></li>
          <li><button aria-pressed="false" class="flex h-20 w-full flex-col justify-between rounded-lg p-4 text-left bg-card"><span class="text-chart-3"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"/><path d="M7 16v6"/><path d="M13 19v3"/><path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5"/></svg></span><span class="text-[15px] font-semibold">Night forest</span></button></li>
          <li><button aria-pressed="false" class="flex h-20 w-full flex-col justify-between rounded-lg p-4 text-left bg-card"><span class="text-chart-3"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg></span><span class="text-[15px] font-semibold">Brown noise</span></button></li>
        </ul>
      </section>
      <section aria-label="Sleep timer">
        <p class="mb-2 text-[14px] text-muted-foreground">Stop playing after</p>
        <div class="grid grid-cols-5 gap-2" role="radiogroup">
          <button role="radio" aria-checked="false" class="h-touch rounded-full text-[15px] font-semibold tabular-nums bg-card text-muted-foreground">15</button>
          <button role="radio" aria-checked="true" class="h-touch rounded-full text-[15px] font-semibold tabular-nums bg-primary text-primary-foreground">30</button>
          <button role="radio" aria-checked="false" class="h-touch rounded-full text-[15px] font-semibold tabular-nums bg-card text-muted-foreground">45</button>
          <button role="radio" aria-checked="false" class="h-touch rounded-full text-[15px] font-semibold tabular-nums bg-card text-muted-foreground">60</button>
          <button role="radio" aria-checked="false" class="h-touch rounded-full text-[15px] font-semibold tabular-nums bg-card text-muted-foreground">Off</button>
        </div>
      </section>
    </div>
    <div class="flex h-[34px] shrink-0 items-end justify-center pb-2" aria-hidden="true"><span class="h-[5px] w-[134px] rounded-full bg-foreground/70"></span></div>
  </main>
</body>
</html>
