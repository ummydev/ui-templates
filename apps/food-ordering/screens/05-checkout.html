<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Pantry</title>
  <!-- Pantry design system: colours, fonts and radius. Add class="dark" to <html> for the dark theme. -->
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover);
      --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary);
      --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-border: var(--border);
      --color-input: var(--input);
      --color-ring: var(--ring);
      --color-chart-1: var(--chart-1);
      --color-chart-2: var(--chart-2);
      --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4);
      --color-chart-5: var(--chart-5);
      --font-sans: var(--font-sans);
      --font-heading: var(--font-heading);
      --radius-sm: calc(var(--radius) - 8px);
      --radius-md: calc(var(--radius) - 6px);
      --radius-lg: var(--radius);
      --spacing-touch: var(--touch);
      --spacing-screen: var(--screen-padding);
      --spacing-tab-bar: var(--tab-bar);
      /* Soft and low, for floating elements only: the cart bar and buttons over images. */
      --shadow-float: 0 8px 24px -10px oklch(0.236 0.03 47.408 / 0.35);
    }
    @layer base {
      body { @apply bg-background font-sans text-foreground antialiased; }
    }
  </style>
</head>
<body>
  <main class="relative mx-auto flex h-[844px] w-[390px] flex-col overflow-hidden bg-background">
    <div class="flex h-12 shrink-0 items-center justify-between px-8 pt-2 text-[15px] font-semibold">
      <span class="tabular-nums">9:41</span>
      <span class="flex items-center gap-1.5" aria-hidden="true">
        <svg class="h-3 w-[18px]" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg class="h-3 w-4" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 .9.2 1.2.5L8 11.2 6.8 9.8c.3-.3.7-.5 1.2-.5Z"/></svg>
        <svg class="h-3 w-[26px]" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><path d="M24 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <header class="flex shrink-0 items-center gap-1 px-2 pb-2">
      <a href="04-cart.html" class="flex size-touch items-center justify-center rounded-full" aria-label="Back"><svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <div class="flex-1 pr-touch text-center">
        <h1 class="font-heading text-[22px] leading-tight font-bold">Checkout</h1>
        
      </div>
    </header>
    <div class="flex flex-1 flex-col gap-3 overflow-hidden px-screen pt-1">
      <section class="rounded-lg bg-card p-4">
        <div class="mb-2 flex items-baseline justify-between">
          <h2 class="text-[13px] font-semibold tracking-[0.02em] text-muted-foreground uppercase">Deliver to</h2>
          <a href="#" class="text-[15px] font-semibold text-primary">Change</a>
        </div>
        <div class="flex items-center gap-3">
          <span class="flex size-10 items-center justify-center rounded-full bg-secondary text-secondary-foreground"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <span><span class="block text-[16px] font-semibold">214 Bedford Ave, Apt 3R</span><span class="block text-[13px] text-muted-foreground">Brooklyn, NY 11249 · Ring 3R</span></span>
        </div>
      </section>
      <section class="rounded-lg bg-card p-4">
        <div class="mb-2 flex items-baseline justify-between">
          <h2 class="text-[13px] font-semibold tracking-[0.02em] text-muted-foreground uppercase">When</h2>
          
        </div>
        <div class="grid grid-cols-2 gap-2" role="radiogroup">
          <label class="flex flex-col rounded-md border-2 border-primary bg-primary/5 px-3.5 py-2.5"><input type="radio" name="when" class="sr-only" checked><span class="text-[15px] font-semibold">Standard</span><span class="text-[13px] text-muted-foreground">25–35 min</span></label>
          <label class="flex flex-col rounded-md border border-input px-3.5 py-2.5"><input type="radio" name="when" class="sr-only"><span class="flex items-center gap-1.5 text-[15px] font-semibold"><svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 14v2.2l1.6 1"/><path d="M16 2v3"/><path d="M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338"/><path d="M3 9h5.859"/><path d="M8 2v3"/><circle cx="16" cy="16" r="6"/></svg>Schedule</span><span class="text-[13px] text-muted-foreground">Choose a time</span></label>
        </div>
      </section>
      <section class="rounded-lg bg-card p-4">
        <div class="mb-2 flex items-baseline justify-between">
          <h2 class="text-[13px] font-semibold tracking-[0.02em] text-muted-foreground uppercase">Payment</h2>
          <a href="#" class="text-[15px] font-semibold text-primary">Add</a>
        </div>
        <div class="flex flex-col divide-y divide-border">
          <label class="flex min-h-touch items-center gap-3">
          <span class="flex size-10 items-center justify-center rounded-full bg-muted"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M6 14h2"/></svg></span>
          <span class="flex-1"><span class="block text-[16px] font-semibold">Visa •••• 4242</span><span class="block text-[13px] text-muted-foreground">Expires 09/28</span></span>
          <input type="radio" name="pay" class="sr-only" checked>
          <span class="flex size-6 items-center justify-center rounded-full bg-primary"><span class="size-2.5 rounded-full bg-primary-foreground"></span></span>
        </label>
          <label class="flex min-h-touch items-center gap-3">
          <span class="flex size-10 items-center justify-center rounded-full bg-muted"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>
          <span class="flex-1"><span class="block text-[16px] font-semibold">Apple Pay</span><span class="block text-[13px] text-muted-foreground">Pay with Face ID</span></span>
          <input type="radio" name="pay" class="sr-only">
          <span class="flex size-6 items-center justify-center rounded-full border-2 border-input"></span>
        </label>
        </div>
      </section>
      <section class="rounded-lg bg-card p-4">
        <div class="mb-2 flex items-baseline justify-between">
          <h2 class="text-[13px] font-semibold tracking-[0.02em] text-muted-foreground uppercase">Tip your rider</h2>
          
        </div>
        <div class="grid grid-cols-4 gap-2">
          <label class="flex h-14 flex-col items-center justify-center rounded-full text-[15px] font-semibold border border-input"><input type="radio" name="tip" class="sr-only">10%<span class="text-[12px] font-normal tabular-nums text-muted-foreground">$3.35</span></label>
          <label class="flex h-14 flex-col items-center justify-center rounded-full text-[15px] font-semibold bg-foreground text-background"><input type="radio" name="tip" class="sr-only" checked>15%<span class="text-[12px] font-normal tabular-nums opacity-80">$5.03</span></label>
          <label class="flex h-14 flex-col items-center justify-center rounded-full text-[15px] font-semibold border border-input"><input type="radio" name="tip" class="sr-only">20%<span class="text-[12px] font-normal tabular-nums text-muted-foreground">$6.70</span></label>
          <label class="flex h-14 flex-col items-center justify-center rounded-full text-[15px] font-semibold border border-input"><input type="radio" name="tip" class="sr-only">Other</label>
        </div>
        <p class="mt-2 text-[13px] text-muted-foreground">Diego gets 100% of your tip.</p>
      </section>
    </div>
    <div class="shrink-0 border-t border-border bg-card px-screen pt-3">
      <dl class="mb-3 flex items-baseline justify-between">
        <dt class="font-heading text-[19px] font-bold">Total <span class="font-sans text-[13px] font-normal text-muted-foreground">incl. $5.03 tip</span></dt>
        <dd class="font-heading text-[19px] font-bold tabular-nums">$43.85</dd>
      </dl>
      <a href="06-tracking.html" class="flex h-14 items-center justify-center rounded-full bg-primary text-[17px] font-semibold text-primary-foreground">Place order</a>
      <div class="flex h-[34px] shrink-0 items-end justify-center pb-2" aria-hidden="true"><span class="h-[5px] w-[134px] rounded-full bg-foreground/80"></span></div>
    </div>
