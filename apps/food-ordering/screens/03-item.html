<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margherita · Pantry</title>
  <!-- Pantry design system: colours, fonts and radius. Add class="dark" to <html> for the dark theme. -->
  <link rel="stylesheet" href="../tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover);
      --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary);
      --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-border: var(--border);
      --color-input: var(--input);
      --color-ring: var(--ring);
      --color-chart-1: var(--chart-1);
      --color-chart-2: var(--chart-2);
      --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4);
      --color-chart-5: var(--chart-5);
      --font-sans: var(--font-sans);
      --font-heading: var(--font-heading);
      --radius-sm: calc(var(--radius) - 8px);
      --radius-md: calc(var(--radius) - 6px);
      --radius-lg: var(--radius);
      --spacing-touch: var(--touch);
      --spacing-screen: var(--screen-padding);
      --spacing-tab-bar: var(--tab-bar);
      /* Soft and low, for floating elements only: the cart bar and buttons over images. */
      --shadow-float: 0 8px 24px -10px oklch(0.236 0.03 47.408 / 0.35);
    }
    @layer base {
      body { @apply bg-background font-sans text-foreground antialiased; }
    }
  </style>
</head>
<body>
  <main class="relative mx-auto flex h-[844px] w-[390px] flex-col overflow-hidden bg-background">
    <div class="absolute inset-x-0 top-0 z-10 flex h-12 shrink-0 items-center justify-between px-8 pt-2 text-[15px] font-semibold">
      <span class="tabular-nums">9:41</span>
      <span class="flex items-center gap-1.5" aria-hidden="true">
        <svg class="h-3 w-[18px]" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg class="h-3 w-4" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .5 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 .9.2 1.2.5L8 11.2 6.8 9.8c.3-.3.7-.5 1.2-.5Z"/></svg>
        <svg class="h-3 w-[26px]" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><path d="M24 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <div class="relative flex h-[210px] shrink-0 items-center justify-center overflow-hidden bg-secondary">
      <img src="../assets/food/pizza-margherita.svg" alt="Margherita pizza with fresh mozzarella and basil" class="size-[250px] translate-y-10">
      <a href="02-restaurant.html" class="absolute top-12 left-3 flex size-touch items-center justify-center rounded-full bg-card shadow-float" aria-label="Close"><svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
      <button class="absolute top-12 right-3 flex size-touch items-center justify-center rounded-full bg-card shadow-float" aria-label="Save"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg></button>
    </div>
    <div class="flex flex-1 flex-col overflow-hidden px-screen pt-4">
      <div class="flex items-start justify-between gap-4">
        <h1 class="font-heading text-[30px] leading-[1.1] font-bold tracking-[-0.015em]">Margherita</h1>
        <p class="font-heading text-[22px] font-bold tabular-nums">$16.00</p>
      </div>
      <p class="mt-1.5 mb-4 text-[15px] leading-normal text-muted-foreground">San Marzano tomato, fior di latte, fresh basil and olive oil, baked for 90 seconds at 900°F.</p>
      <form class="flex flex-col">
        <fieldset class="border-t border-border py-4">
          <legend class="float-left mb-1 flex w-full items-baseline justify-between">
            <span class="text-[17px] font-semibold">Size</span>
            <span class="rounded-full bg-muted px-2.5 py-0.5 text-[12px] font-semibold text-muted-foreground">Required</span>
          </legend>
          <ul class="clear-both">
            <li><label class="flex min-h-touch items-center gap-3">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full border-2 border-input"></span>
              <input type="radio" name="size" class="sr-only">
              <span class="flex-1 text-[16px]">10" Small</span>
              <span class="text-[15px] text-muted-foreground tabular-nums">$13.00</span>
            </label></li>
            <li><label class="flex min-h-touch items-center gap-3">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full bg-primary text-primary-foreground"><span class="size-2.5 rounded-full bg-primary-foreground"></span></span>
              <input type="radio" name="size" class="sr-only" checked>
              <span class="flex-1 text-[16px]">12" Regular</span>
              <span class="text-[15px] text-muted-foreground tabular-nums">$16.00</span>
            </label></li>
            <li><label class="flex min-h-touch items-center gap-3">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-full border-2 border-input"></span>
              <input type="radio" name="size" class="sr-only">
              <span class="flex-1 text-[16px]">16" Large</span>
              <span class="text-[15px] text-muted-foreground tabular-nums">$22.00</span>
            </label></li>
          </ul>
        </fieldset>
        <fieldset class="border-t border-border py-4">
          <legend class="float-left mb-1 flex w-full items-baseline justify-between">
            <span class="text-[17px] font-semibold">Chili flakes</span>
            <span class="rounded-full bg-muted px-2.5 py-0.5 text-[12px] font-semibold text-muted-foreground">Pick 1</span>
          </legend>
          <div class="clear-both flex gap-2 pt-1">
            <label class="flex h-touch flex-1 items-center justify-center gap-1.5 rounded-full text-[15px] font-semibold border border-input"><input type="radio" name="chili" class="sr-only">None</label>
            <label class="flex h-touch flex-1 items-center justify-center gap-1.5 rounded-full text-[15px] font-semibold bg-foreground text-background"><input type="radio" name="chili" class="sr-only" checked><svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg>Mild</label>
            <label class="flex h-touch flex-1 items-center justify-center gap-1.5 rounded-full text-[15px] font-semibold border border-input"><input type="radio" name="chili" class="sr-only"><svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg>Hot</label>
          </div>
        </fieldset>
        <fieldset class="border-t border-border py-4">
          <legend class="float-left mb-1 flex w-full items-baseline justify-between">
            <span class="text-[17px] font-semibold">Extras</span>
            <span class="rounded-full bg-muted px-2.5 py-0.5 text-[12px] font-semibold text-muted-foreground">Optional</span>
          </legend>
          <ul class="clear-both">
            <li><label class="flex min-h-touch items-center gap-3">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-[7px] bg-primary text-primary-foreground"><svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
              <input type="checkbox" name="extra" class="sr-only" checked>
              <span class="flex-1 text-[16px]">Hot honey</span>
              <span class="text-[15px] text-muted-foreground tabular-nums">+$1.50</span>
            </label></li>
            <li><label class="flex min-h-touch items-center gap-3">
              <span class="flex size-6 shrink-0 items-center justify-center rounded-[7px] border-2 border-input"></span>
              <input type="checkbox" name="extra" class="sr-only">
              <span class="flex-1 text-[16px]">Extra burrata</span>
              <span class="text-[15px] text-muted-foreground tabular-nums">+$4.00</span>
            </label></li>
          </ul>
        </fieldset>
      </form>
    </div>
    <div class="shrink-0 border-t border-border bg-card px-screen pt-3">
      <div class="flex items-center gap-3">
        <div class="flex h-14 items-center rounded-full bg-muted">
          <button class="flex size-14 items-center justify-center" aria-label="One less"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <span class="w-5 text-center text-[17px] font-semibold tabular-nums">1</span>
          <button class="flex size-14 items-center justify-center" aria-label="One more"><svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
        </div>
        <a href="04-cart.html" class="flex h-14 flex-1 items-center justify-between rounded-full bg-primary px-6 text-[17px] font-semibold text-primary-foreground">Add to cart <span class="tabular-nums">$17.50</span></a>
      </div>
      <div class="flex h-[34px] shrink-0 items-end justify-center pb-2" aria-hidden="true"><span class="h-[5px] w-[134px] rounded-full bg-foreground/80"></span></div>
    </div>
  </main>
</body>
</html>
